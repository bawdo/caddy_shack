codecov:
  notify:
    # CI uploads three reports per commit, merged into one total: unit-linux
    # and unit-darwin (the Test matrix) and integration (the Docker suite).
    # Waiting for all three stops a status or comment going out on a partial
    # merge, which would read low and fail the floor below.
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      # Floor: project coverage must stay at or above 80%. Measured coverage
      # was 80.1% on 2026-10-27.
      default:
        target: 80%
        threshold: 1%
        informational: false
        if_ci_failed: error
      # Ratchet: a change may not drop coverage more than 1% below its base,
      # even while still above the floor.
      no-regression:
        target: auto
        threshold: 1%
        informational: false
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 0.5%
        informational: true
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  after_n_builds: 3
  hide_project_coverage: false

ignore:
  - "**/*_test.go"
  - "**/testdata"

github_checks:
  annotations: true
