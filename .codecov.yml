codecov:
  notify:
    # CI uploads three reports per commit, merged into one total: unit-linux
    # and unit-darwin (the Test matrix) and integration (the Docker suite).
    # Waiting for all three stops a status or comment going out on a partial
    # merge, which would read low and fail the floor below.
    after_n_builds: 3

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      # Floor: project coverage must stay at or above 85%. This is Codecov's
      # line figure over the merged unit-linux, unit-darwin and integration
      # uploads, where a partly run line (usually an untested error branch)
      # counts as a miss. It reads lower than `go tool cover`'s statement
      # figure: on 2026-11-01 Codecov showed 77.54% for 79.9% of statements
      # (Linux unit tests only). The first merged report with all three
      # uploads, on main at a4c6111 (PR #19, 2026-11-01), showed 90.24%
      # (3,758 of 4,164 lines hit, 146 partial), so 85% leaves about five
      # points of headroom.
      default:
        target: 85%
        threshold: 1%
        informational: false
        if_ci_failed: error
      # Ratchet: a change may not drop coverage more than 1% below its base,
      # even while still above the floor.
      no-regression:
        target: auto
        threshold: 1%
        informational: false
        if_ci_failed: error

    patch:
      default:
        target: 70%
        threshold: 0.5%
        informational: true
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  after_n_builds: 3
  hide_project_coverage: false

ignore:
  - "**/*_test.go"
  - "**/testdata"
  # Integration helpers live in non-_test.go files behind a build tag, so
  # -coverpkg=./... instruments them. They are test code, not product.
  - "test/**"

github_checks:
  annotations: true
