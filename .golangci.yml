version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - gosec
  exclusions:
    rules:
      # gosec flags test fixtures (file IO with derived paths, 0o755 perms
      # on tempdir stubs) that aren't a real security concern in tests.
      - path: _test\.go
        linters:
          - gosec
      # gosec G204 in cli.go: exec.Command args are derived from internal
      # constants (CaddyContainerName, CaddyImage, named volumes), not from
      # untrusted input. False positive for the MVP threat model. Scoped to
      # G204 so any other gosec rule still applies.
      - path: internal/docker/cli\.go
        text: "G204"
        linters:
          - gosec
      # gosec G204 in doctor_checks.go: doctor probes/fixes shell out to
      # documented system tools (dscacheutil, security, brew, sudo, nc,
      # wget). Args come from package constants and state.json which is
      # written only by this binary; not untrusted input. Scoped to G204.
      - path: internal/app/doctor_checks\.go
        text: "G204"
        linters:
          - gosec
      # gosec G204 in cmd/doctor.go: sudo preflight is `sudo -n true` with
      # hard-coded args; the seam exists for test stubbing, not for
      # caller-controlled command construction. Scoped to G204.
      - path: cmd/doctor\.go
        text: "G204"
        linters:
          - gosec
      # gosec G304 in state package: paths come from DefaultPaths()
      # (rooted at os.UserConfigDir) or t.TempDir() in tests. False positive.
      # Scoped to G304 so any other gosec rule still applies.
      - path: internal/state/
        text: "G304"
        linters:
          - gosec
      # QF1001 (apply De Morgan's law) and QF1011 (omit inferable type) are
      # stylistic "quickfix" suggestions, not correctness checks. QF1011
      # specifically fires on deliberate interface-conformance assertions
      # like `var _ output.Renderer = NewFoo(...)` where the explicit type
      # IS the test. Suppress by text so the default staticcheck check set
      # (which omits ST1000 et al.) stays intact.
      - linters:
          - staticcheck
        text: "QF1001"
      - linters:
          - staticcheck
        text: "QF1011"
