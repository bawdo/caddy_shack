name: Release

# Pushing a vX.Y.Z tag (made with `make release`) publishes its GitHub
# release. CI runs first (reused from ci.yml). The tag must be on main,
# annotated and signed (GitHub verifies the signature), and CHANGELOG.md must
# be consistent. The release notes are the version's changelog section, never
# written by hand. Archives for linux and darwin on amd64 and arm64 are built,
# smoke tested, attested with build provenance and attached with a checksums
# file. SECURITY.md ("Verifying a release") has the commands to check them.
# The attestation's Sigstore bundle is attached too, as
# caddy_shack_<version>_provenance.intoto.jsonl, so --bundle can check it
# without the attestation API.
#
# Only the publish job can write to the repository, and it checks out nothing
# but scripts/publish-release.sh and runs no Go and no dependency. The build
# job compiles with a read-only token and without the Go cache, so neither a
# token nor a poisoned cache entry is in reach of the code that ends up in
# the release.
#
# A published release is never changed. If a run fails part way, fix the
# cause and run this workflow by hand with the existing tag: a leftover draft
# is replaced and the release published.

permissions:
  contents: read

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish again
        type: string
        required: true

# Keyed on the tag, so a tag push and a re-run for the same tag queue
# behind each other.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # The dispatch input reaches checkout below, so check its shape first.
      - name: Check the tag name
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag to release is not of the form vX.Y.Z"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Fully qualified, so a branch with the tag's name is never built.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the tag to release is not of the form vX.Y.Z"
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::the checked-out commit is not the commit $TAG points at"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-tag.sh "$TAG"

      - name: Check the changelog
        run: scripts/changelog.sh check

      - name: Write release notes
        run: |
          scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          # No cache: ci.yml jobs write it after testing every dependency.
          cache: false

      - name: Verify module checksums
        run: go mod verify

      - name: Build and smoke test the archives
        run: scripts/build-release.sh "${TAG#v}" "$(git rev-parse "refs/tags/$TAG^{commit}")"

      - name: Keep the archives for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep the release notes for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the build provenance attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout the publish script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/publish-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Check the archives match their checksums
        run: cd dist && sha256sum -c checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: scripts/publish-release.sh "$TAG" notes/notes.md "$BUNDLE_PATH"
